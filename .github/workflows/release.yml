name: Release

on:
  push:
    tags:
      - "xret-*-v*"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.33"

      - name: Install Python
        run: uv python install 3.12

      - name: Extract package name from tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          # xret-data-v0.3.0 → xret-data
          PACKAGE="${TAG%-v*}"
          echo "package=${PACKAGE}" >> "$GITHUB_OUTPUT"

      - name: Configure package smoke test
        id: smoke
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
        run: |
          case "$PACKAGE" in
            xret-data)
              IMPORT_NAME="xret.data"
              ;;
            *)
              echo "::error::No wheel smoke-test import configured for ${PACKAGE}"
              exit 1
              ;;
          esac

          echo "import_name=${IMPORT_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify version matches tag
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG##*-v}"
          PYPROJECT_VERSION=$(grep '^version' "packages/${PACKAGE}/pyproject.toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version ${TAG_VERSION} does not match pyproject.toml version ${PYPROJECT_VERSION}"
            exit 1
          fi

      - name: Build
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
        run: uv build --package "$PACKAGE" --out-dir dist

      - name: Smoke test (wheel)
        env:
          IMPORT_NAME: ${{ steps.smoke.outputs.import_name }}
        run: |
          uv venv .smoke --python 3.12
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -c "import ${IMPORT_NAME}"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.33"

      - name: Download distribution artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Publish to PyPI
        run: uv publish dist/*

  create-github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists for $TAG"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --fail-on-no-commits \
              --title "$TAG"
          fi
