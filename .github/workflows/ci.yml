name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked environment
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest

      - name: Build xret-data
        run: uv build --package xret-data --out-dir dist

      - name: Smoke-test built wheel
        run: |
          uv venv .smoke --python 3.12
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -c "import xret.data"
