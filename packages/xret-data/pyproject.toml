[project]
name = "xret-data"
version = "0.2.0"
description = "Trusted market data infrastructure for Xret."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "polars",
    "ccxt>=4.4,<5",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "xret.data"
